{% extends 'base.html' %}

{% block title %}Post a Job - JobPortal{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="bg-white shadow sm:rounded-lg border border-gray-100 p-6 sm:p-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Post a New Job</h2>
        
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 gap-y-6 sm:grid-cols-2 sm:gap-x-8">
                <div class="sm:col-span-2">
                    <label for="id_title" class="block text-sm font-medium text-gray-700">Job Title</label>
                    <div class="mt-1">
                        <input type="text" name="title" id="id_title" required class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md border p-2">
                    </div>
                </div>

                <div class="sm:col-span-2">
                    <label for="id_description" class="block text-sm font-medium text-gray-700">Description</label>
                    <div class="mt-1">
                        <textarea name="description" id="id_description" rows="5" required class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md border p-2"></textarea>
                    </div>
                </div>

                <div>
                    <label for="id_location" class="block text-sm font-medium text-gray-700">Location</label>
                    <div class="mt-1">
                        <input type="text" name="location" id="id_location" required class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md border p-2">
                    </div>
                </div>

                <div>
                    <label for="id_job_type" class="block text-sm font-medium text-gray-700">Job Type</label>
                    <div class="mt-1">
                        <select name="job_type" id="id_job_type" class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md border p-2">
                            <option value="FULL_TIME">Full Time</option>
                            <option value="PART_TIME">Part Time</option>
                            <option value="CONTRACT">Contract</option>
                            <option value="INTERNSHIP">Internship</option>
                        </select>
                    </div>
                </div>
                
                <div class="sm:col-span-2">
                    <label for="id_salary_range" class="block text-sm font-medium text-gray-700">Salary Range (Optional)</label>
                    <div class="mt-1">
                        <input type="text" name="salary_range" id="id_salary_range" placeholder="e.g. $80,000 - $100,000" class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md border p-2">
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-4 border-t border-gray-100">
                <a href="{% url 'dashboard' %}" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 mr-3">Cancel</a>
                <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Post Job</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
